name: Build SedaDub iPad IPA (No Mac Needed)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Unsigned iPad App + ReplayKit Extension
        run: |
          xcodebuild \
            -project SedaDub.xcodeproj \
            -scheme SedaDub \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package SedaDub-iPad.ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SedaDub.app Payload/
          zip -r SedaDub-iPad.ipa Payload

      - name: Upload SedaDub-iPad.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SedaDub-iPad-IPA
          path: SedaDub-iPad.ipa
